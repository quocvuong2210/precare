name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analysis-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q backend/app

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build