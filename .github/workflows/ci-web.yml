name: CI - Web Doctor

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web_doctor/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'web_doctor/**'

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build