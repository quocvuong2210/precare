name: CI - Analysis

on:
  push:
    branches: [ "main" ]
    paths:
      - 'analysis_service/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'analysis_service/**'

permissions:
  contents: read

jobs:
  analysis-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest