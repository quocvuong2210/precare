version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: precare_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-precare_db}
      POSTGRES_USER: ${POSTGRES_USER:-precare_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-precare_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-precare_admin} -d ${POSTGRES_DB:-precare_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: precare_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: precare_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-precare_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-precare_minio_secret}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  analysis_service:
    build:
      context: ./analysis_service
      dockerfile: Dockerfile
    container_name: precare_analysis_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=analysis_service
      - PORT=8001
      - RULE_VERSION=1.0.0-hadlock-intergrowth
      - MODEL_VERSION=1.0.0-racanet-v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: precare_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-precare_admin}:${POSTGRES_PASSWORD:-precare_secret_2026}@db:5432/${POSTGRES_DB:-precare_db}
      - REDIS_URL=redis://redis:6379/0
      - ANALYSIS_SERVICE_URL=http://analysis_service:8001
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-precare_minio}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-precare_minio_secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-precare_super_secret_jwt_key_2026_change_in_prod}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      analysis_service:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: precare_celery_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-precare_admin}:${POSTGRES_PASSWORD:-precare_secret_2026}@db:5432/${POSTGRES_DB:-precare_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  web_doctor:
    build:
      context: ./web_doctor
      dockerfile: Dockerfile
    container_name: precare_web_doctor
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
